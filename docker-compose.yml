# Khởi chạy toàn bộ hệ thống (Frontend, Backend, DB, Redis, AI) chỉ với 1 lệnh: docker compose up
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "5000:5000"
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    depends_on: [backend]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
  redis:
    image: redis:7
